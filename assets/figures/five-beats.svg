<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" role="img" aria-labelledby="t">
  <title id="t">Five beats of one tool-calling step</title>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#6e6758"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #211f1a; }
    .n { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #6e6758; }
    .you { fill: #fff; stroke: #211f1a; }
    .model { fill: #f8f1e0; stroke: #8a6d2f; }
    .harness { fill: #edf1f5; stroke: #4a6b8a; }
  </style>
  <g>
    <rect class="you" x="8" y="36" width="120" height="78" rx="8"/>
    <text class="n" x="68" y="68" text-anchor="middle">1 · You</text>
    <text class="s" x="68" y="88" text-anchor="middle">context + schema</text>
    <rect class="model" x="152" y="36" width="120" height="78" rx="8"/>
    <text class="n" x="212" y="68" text-anchor="middle">2 · Model</text>
    <text class="s" x="212" y="88" text-anchor="middle">tool call + id</text>
    <rect class="harness" x="296" y="36" width="128" height="78" rx="8"/>
    <text class="n" x="360" y="68" text-anchor="middle">3 · Harness</text>
    <text class="s" x="360" y="88" text-anchor="middle">runs the function</text>
    <rect class="you" x="448" y="36" width="120" height="78" rx="8"/>
    <text class="n" x="508" y="68" text-anchor="middle">4 · You</text>
    <text class="s" x="508" y="88" text-anchor="middle">append result</text>
    <rect class="model" x="592" y="36" width="120" height="78" rx="8"/>
    <text class="n" x="652" y="68" text-anchor="middle">5 · Model</text>
    <text class="s" x="652" y="88" text-anchor="middle">answer or again</text>
  </g>
  <path d="M128 75h24" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M272 75h24" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M424 75h24" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M568 75h24" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s" x="360" y="148" text-anchor="middle">Same sequence OpenAI documents for function calling. The model never executes step 3.</text>
</svg>