<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t">
  <title id="t">ReAct interleaves thought, action, and observation</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#6e6758" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #211f1a; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .body { font-size: 13px; }
    .note { font-size: 11px; fill: #6e6758; }
  </style>
  <rect x="16" y="20" width="176" height="72" rx="8" fill="#f8f1e0" stroke="#8a6d2f"/>
  <text class="lab" x="104" y="44" text-anchor="middle" fill="#8a6d2f">THOUGHT</text>
  <text class="body" x="104" y="68" text-anchor="middle">I need the treaty year.</text>
  <rect x="272" y="20" width="176" height="72" rx="8" fill="#fff" stroke="#211f1a"/>
  <text class="lab" x="360" y="44" text-anchor="middle">ACTION</text>
  <text class="body" x="360" y="68" text-anchor="middle">Search[Versailles]</text>
  <rect x="528" y="20" width="176" height="72" rx="8" fill="#edf1f5" stroke="#4a6b8a"/>
  <text class="lab" x="616" y="44" text-anchor="middle" fill="#4a6b8a">OBSERVATION</text>
  <text class="body" x="616" y="68" text-anchor="middle">signed 28 June 1919</text>
  <path d="M192 56 H260" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M448 56 H516" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M616 92 V128 H104 V156" fill="none" stroke="#6e6758" stroke-width="1.4" marker-end="url(#arr)"/>
  <text class="note" x="360" y="116" text-anchor="middle">grounds the next thought</text>
  <rect x="16" y="156" width="176" height="72" rx="8" fill="#f8f1e0" stroke="#8a6d2f"/>
  <text class="lab" x="104" y="180" text-anchor="middle" fill="#8a6d2f">NEXT THOUGHT</text>
  <text class="body" x="104" y="204" text-anchor="middle">The year is 1919.</text>
</svg>
